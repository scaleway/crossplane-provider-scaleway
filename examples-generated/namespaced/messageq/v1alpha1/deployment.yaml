apiVersion: messageq.scaleway.m.upbound.io/v1alpha1
kind: Deployment
metadata:
  annotations:
    meta.upbound.io/example-id: messageq/v1alpha1/deployment
  labels:
    testing.upbound.io/example-name: main
  name: main
  namespace: upbound-system
spec:
  forProvider:
    name: my-messageq
    nodeCount: 1
    nodeType: MESSAGEQ-SHARED-2C-8G
    passwordSecretRef:
      key: example-key
      name: example-secret
    userName: admin
    version: "4.0"
    volume:
      sizeInGb: 5
      type: sbs_5k
