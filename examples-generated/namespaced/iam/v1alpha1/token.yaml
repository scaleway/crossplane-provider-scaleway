apiVersion: iam.scaleway.m.upbound.io/v1alpha1
kind: Token
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1alpha1/token
  labels:
    testing.upbound.io/example-name: main
  name: main
  namespace: upbound-system
spec:
  forProvider:
    organizationId: your-organization-id
    scimIdSelector:
      matchLabels:
        testing.upbound.io/example-name: main

---

apiVersion: iam.scaleway.m.upbound.io/v1alpha1
kind: Scim
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1alpha1/token
  labels:
    testing.upbound.io/example-name: main
  name: main
  namespace: upbound-system
spec:
  forProvider:
    organizationId: your-organization-id
