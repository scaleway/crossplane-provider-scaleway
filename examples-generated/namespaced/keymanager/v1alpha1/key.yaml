apiVersion: keymanager.scaleway.m.upbound.io/v1alpha1
kind: Key
metadata:
  annotations:
    meta.upbound.io/example-id: keymanager/v1alpha1/key
  labels:
    testing.upbound.io/example-name: rsa_4096
  name: rsa-4096
  namespace: upbound-system
spec:
  forProvider:
    algorithm: rsa_oaep_4096_sha256
    description: Key for encrypting large files with RSA-4096
    name: rsa-4096-key
    region: fr-par
    unprotected: true
    usage: asymmetric_encryption
