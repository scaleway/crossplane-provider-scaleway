apiVersion: billing.scaleway.m.upbound.io/v1alpha1
kind: Notification
metadata:
  annotations:
    meta.upbound.io/example-id: billing/v1alpha1/notification
  labels:
    testing.upbound.io/example-name: email
  name: email
  namespace: upbound-system
spec:
  forProvider:
    budgetAlertIdSelector:
      matchLabels:
        testing.upbound.io/example-name: main
    emailAddresses:
    - alerts@example.com
    - billing@example.com

---

apiVersion: billing.scaleway.m.upbound.io/v1alpha1
kind: Budget
metadata:
  annotations:
    meta.upbound.io/example-id: billing/v1alpha1/notification
  labels:
    testing.upbound.io/example-name: main
  name: main
  namespace: upbound-system
spec:
  forProvider:
    consumptionLimit: 10000
    enabled: true
    organizationId: 11111111-1111-1111-1111-111111111111

---

apiVersion: billing.scaleway.m.upbound.io/v1alpha1
kind: Alert
metadata:
  annotations:
    meta.upbound.io/example-id: billing/v1alpha1/notification
  labels:
    testing.upbound.io/example-name: main
  name: main
  namespace: upbound-system
spec:
  forProvider:
    budgetIdSelector:
      matchLabels:
        testing.upbound.io/example-name: main
    threshold: 80
