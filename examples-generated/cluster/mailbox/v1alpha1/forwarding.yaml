apiVersion: mailbox.scaleway.upbound.io/v1alpha1
kind: Forwarding
metadata:
  annotations:
    meta.upbound.io/example-id: mailbox/v1alpha1/forwarding
  labels:
    testing.upbound.io/example-name: backup
  name: backup
spec:
  forProvider:
    email: backup@example.com
    mailboxIdSelector:
      matchLabels:
        testing.upbound.io/example-name: main

---

apiVersion: mailbox.scaleway.upbound.io/v1alpha1
kind: Mailbox
metadata:
  annotations:
    meta.upbound.io/example-id: mailbox/v1alpha1/forwarding
  labels:
    testing.upbound.io/example-name: main
  name: main
spec:
  forProvider:
    domainIdSelector:
      matchLabels:
        testing.upbound.io/example-name: main
    forwardingEnabled: true
    forwardingKeepCopy: true
    localPart: contact
    passwordWo: ${var.mailbox_password}
    passwordWoVersion: 1
    subscriptionPeriod: monthly

---

apiVersion: mailbox.scaleway.upbound.io/v1alpha1
kind: Domain
metadata:
  annotations:
    meta.upbound.io/example-id: mailbox/v1alpha1/forwarding
  labels:
    testing.upbound.io/example-name: main
  name: main
spec:
  forProvider:
    name: mail.example.com
