apiVersion: mailbox.scaleway.upbound.io/v1alpha1
kind: Alias
metadata:
  annotations:
    meta.upbound.io/example-id: mailbox/v1alpha1/alias
  labels:
    testing.upbound.io/example-name: contact
  name: contact
spec:
  forProvider:
    description: Public contact address
    localPart: contact
    mailboxIdSelector:
      matchLabels:
        testing.upbound.io/example-name: john

---

apiVersion: mailbox.scaleway.upbound.io/v1alpha1
kind: Mailbox
metadata:
  annotations:
    meta.upbound.io/example-id: mailbox/v1alpha1/alias
  labels:
    testing.upbound.io/example-name: john
  name: john
spec:
  forProvider:
    domainIdSelector:
      matchLabels:
        testing.upbound.io/example-name: main
    localPart: john.doe
    passwordWo: ${var.mailbox_password}
    passwordWoVersion: 1
    subscriptionPeriod: monthly

---

apiVersion: mailbox.scaleway.upbound.io/v1alpha1
kind: Domain
metadata:
  annotations:
    meta.upbound.io/example-id: mailbox/v1alpha1/alias
  labels:
    testing.upbound.io/example-name: main
  name: main
spec:
  forProvider:
    name: mail.example.com
